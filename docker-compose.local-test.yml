services:
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: forgot-information-sqlserver-test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevTest!2026"
    ports:
      - "14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - forgot-information-test-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: forgot-information-mailhog
    ports:
      - "8025:8025" # web UI: open http://localhost:8025 to read the codes sent by email
      - "1025:1025"
    networks:
      - forgot-information-test-net

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: forgot-information-wiremock
    command: ["--global-response-templating"]
    ports:
      - "8089:8080" # http://localhost:8089/__admin/mappings to inspect the stubbed requests
    volumes:
      - ./test/wiremock/mappings:/home/wiremock/mappings:ro
    networks:
      - forgot-information-test-net

  forgot-information-test:
    container_name: forgot-information-test
    build:
      context: .
      dockerfile: src/ms-forgot-information.Api/Dockerfile
    ports:
      - "8091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver-test,1433;Database=ForgotInformationTest;User Id=sa;Password=DevTest!2026;TrustServerCertificate=True;"
      Jwt__Issuer: school-guardian
      Jwt__Audience: school-guardian-clients
      # Paste the public key printed by `dotnet run --project tools/dev-token` into DEV_JWT_PUBLIC_KEY (.env or shell env var).
      Jwt__PublicKey: "${DEV_JWT_PUBLIC_KEY}"
      Otp__HashPepper: "local-test-pepper-not-for-production"
      IdentityDirectory__IamServiceBaseUrl: "http://wiremock:8080"
      IdentityDirectory__UserManagementServiceBaseUrl: "http://wiremock:8080"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Smtp__EnableSsl: "false"
      Smtp__FromAddress: no-reply@guardianescolar.com
      Smtp__FromName: "Guardian Escolar (local test)"
      Sms__Provider: Log
    depends_on:
      sqlserver-test:
        condition: service_healthy
    networks:
      - forgot-information-test-net

networks:
  forgot-information-test-net:
