services:
  ms-forgot-information.api:
    container_name: ms-forgot-information
    image: ms-forgot-information.api
    restart: always
    build:
      context: .
      dockerfile: src/ms-forgot-information.Api/Dockerfile
    ports:
      - "8091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in .env}"
      IdentityDirectory__IamServiceBaseUrl: "http://ms-iam:8080"
      IdentityDirectory__IamApiKey: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY to the same value used by ms-iam}"
      Otp__HashPepper: "${OTP_HASH_PEPPER:?Set OTP_HASH_PEPPER in .env}"
      Smtp__Host: "${SMTP_HOST:?Set SMTP_HOST in .env}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL:-true}"
      Smtp__User: "${SMTP_USER:?Set SMTP_USER in .env}"
      Smtp__Password: "${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}"
      Smtp__FromAddress: "${SMTP_FROM:?Set SMTP_FROM in .env}"
      Smtp__FromName: "Guardian Escolar"
      Branding__LogoUrl: "${EMAIL_LOGO_URL:-}"
      Branding__HeroImageUrl: "${EMAIL_HERO_IMAGE_URL:-}"
      Branding__TermsUrl: "${EMAIL_TERMS_URL:-}"
      Branding__PrivacyUrl: "${EMAIL_PRIVACY_URL:-}"
      Twilio__AccountSid: "${TWILIO_ACCOUNT_SID:-}"
      Twilio__ApiKey: "${TWILIO_API_KEY:-}"
      Twilio__ApiSecret: "${TWILIO_API_SECRET:-}"
      Twilio__VerifyServiceSid: "${TWILIO_VERIFY_SERVICE_SID:-}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN:-http://localhost:4200}"
    env_file:
      - .env
    networks:
      - sg-services-network

networks:
  sg-services-network:
    external: true
